version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clap_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clap
    # Bind to loopback only — never expose Postgres on the public internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clap_network

  redis:
    image: redis:7-alpine
    container_name: clap_redis
    # Bind to loopback only — never expose Redis on the public internet.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clap_network

  # Local SMTP catcher for OTP emails (no auth / no TLS).
  # Web UI: http://<host>:8025  |  SMTP stays on the Docker network only.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: clap_mailhog
    ports:
      # SMTP is not published; API reaches mailhog:1025 over clap_network.
      - "8025:8025" # Web UI (needed to read OTP codes in dev)
    networks:
      - clap_network
    restart: unless-stopped

  # One-shot: apply pending *.up.sql migrations and seed default roles.
  migrate:
    image: postgres:16-alpine
    container_name: clap_migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: clap
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./pkg/migrations:/migrations:ro
      - ./scripts/migrate_and_seed.sh:/migrate_and_seed.sh:ro
    entrypoint: ["/bin/sh", "/migrate_and_seed.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clap_network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clap_api
    # Direct access for local debugging only; public traffic goes through nginx.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ENVIRONMENT: development
      SERVER_PORT: 8080
      SERVER_MODE: debug
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: clap
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: your-secret-key-change-in-production
      JWT_ACCESS_EXPIRY: 7200
      JWT_REFRESH_EXPIRY: 604800
      JWT_ISSUER: clap
      JWT_REFRESH_SECRET: your-refresh-secret-key-change-in-production
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Origin,Content-Type,Authorization
      # OTP email via MailHog inside the compose network (not host "localhost").
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@clap.local
      SMTP_FROM_NAME: Clap
      SMTP_USE_TLS: "false"
      # Disk storage until R2 credentials are configured.
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /data/uploads
      STORAGE_LOCAL_PUBLIC_URL: /uploads
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_APP_URL_SCHEME: ${STRIPE_APP_URL_SCHEME:-smartklap}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-com.say1035.SMARTKLAP}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY:-}
      FOOTBALL_API_BASE_URL: ${FOOTBALL_API_BASE_URL:-https://v3.football.api-sports.io}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - clap_network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: clap_nginx
    # Host port is configurable because :80 is often taken by another service.
    ports:
      - "${NGINX_HTTP_PORT:-8081}:80"
      # - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./deployments/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clap_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  clap_network:
    driver: bridge
