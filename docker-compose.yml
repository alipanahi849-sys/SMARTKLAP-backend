version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clap_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clap_network

  redis:
    image: redis:7-alpine
    container_name: clap_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clap_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clap_api
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: development
      SERVER_PORT: 8080
      SERVER_MODE: debug
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: clap
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: your-secret-key-change-in-production
      JWT_ACCESS_EXPIRY: 900
      JWT_REFRESH_EXPIRY: 604800
      JWT_ISSUER: clap
      JWT_REFRESH_SECRET: your-refresh-secret-key-change-in-production
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Origin,Content-Type,Authorization
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clap_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  clap_network:
    driver: bridge
