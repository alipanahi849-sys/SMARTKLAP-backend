upstream clap_api {
    server api:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream clap_mailhog {
    server mailhog:8025 max_fails=3 fail_timeout=10s;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # The Go app derives the rate-limit key from ClientIP() without a trusted-proxy
    # allowlist, so overwrite X-Forwarded-For instead of appending to it. If another
    # proxy or CDN sits in front of nginx, switch to $proxy_add_x_forwarded_for and
    # enable the set_real_ip_from block below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Connection        "";
    proxy_http_version 1.1;

    # Behind Cloudflare / another load balancer:
    # set_real_ip_from 173.245.48.0/20;
    # real_ip_header   CF-Connecting-IP;
    # real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY    always;
    add_header Referrer-Policy        no-referrer always;

    client_max_body_size 10m;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_next_upstream   error timeout http_502 http_503 http_504;

    # Liveness probe for nginx itself, answered without touching the API.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        access_log off;
        proxy_pass http://clap_api;
    }

    # gin-swagger 404s on /swagger and /swagger/; send browsers to the UI entrypoint.
    # Keep redirects relative (absolute_redirect off) so :8081 is not dropped onto academy :80.
    location = /swagger {
        absolute_redirect off;
        return 302 /swagger/index.html;
    }
    location = /swagger/ {
        absolute_redirect off;
        return 302 /swagger/index.html;
    }

    # MailHog UI + JSON API (OTP inbox). UI is served under /mailhog when
    # the container is started with -ui-web-path mailhog.
    location = /mailhog {
        absolute_redirect off;
        return 302 /mailhog/;
    }
    location /mailhog/ {
        proxy_pass http://clap_mailhog;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    # MailHog UI sets apiHost="" so the browser calls /api/v2 on this origin,
    # while the container serves the JSON API under /mailhog/api/v2.
    location /api/v2 {
        proxy_pass http://clap_mailhog/mailhog/api/v2;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /api/v1/realtime/ws {
        proxy_pass http://clap_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Per-IP concurrent WS cap (raise for stadium / load-test; tune via compose).
        limit_conn ws_conn 10000;
        limit_req  zone=api_limit burst=200 nodelay;
    }

    # Login/register/OTP/refresh: a coarse net in front of the app's own 5/min limiter.
    location ^~ /api/v1/auth/ {
        proxy_pass http://clap_api;
        limit_req  zone=auth_limit burst=10 nodelay;
    }

    location / {
        proxy_pass http://clap_api;
        limit_req  zone=api_limit burst=60 nodelay;
    }
}
