user  nginx;
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time urt=$upstream_response_time';

    # Logs go to the container stdout/stderr so `docker compose logs nginx` works.
    access_log  /dev/stdout  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65s;
    reset_timedout_connection on;

    # Largest upload in the API is a 50MB video; leave room for multipart overhead.
    client_max_body_size    64m;
    client_body_buffer_size 1m;
    client_header_timeout   15s;
    client_body_timeout     60s;
    send_timeout            60s;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        application/json application/javascript application/xml
                      text/plain text/css text/xml image/svg+xml;

    # "Connection: upgrade" only when the client actually asks for an upgrade,
    # otherwise keepalive to the upstream breaks.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
