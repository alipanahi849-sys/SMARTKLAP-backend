basePath: /
definitions:
  clap_internal_modules_notification_dto.RegisterDeviceRequest:
    properties:
      fcm_token:
        type: string
      platform:
        type: string
    required:
    - fcm_token
    - platform
    type: object
  clap_internal_modules_notification_dto.UnregisterDeviceRequest:
    properties:
      fcm_token:
        type: string
    required:
    - fcm_token
    type: object
  clap_internal_modules_order_dto.CalculateOrderRequest:
    properties:
      delivery_method:
        enum:
        - seat
        - pickup
        type: string
      payment_method:
        enum:
        - points
        - card
        type: string
    required:
    - delivery_method
    - payment_method
    type: object
  clap_internal_modules_order_dto.CreateOrderRequest:
    properties:
      currency:
        type: string
      delivery_method:
        enum:
        - seat
        - pickup
        type: string
      seat_number:
        type: string
    required:
    - delivery_method
    type: object
  clap_internal_modules_order_dto.PayOrderRequest:
    properties:
      payment_method:
        enum:
        - points
        - card
        type: string
    required:
    - payment_method
    type: object
  clap_internal_modules_playback_dto.ScheduleSongRequest:
    properties:
      duration_ms:
        description: |-
          DurationMs is the expected playback window in milliseconds.
          Providing it enables overlap detection against other schedules.
          Zero means "unknown duration" and overlap check is skipped.
        type: integer
      match_id:
        type: string
      scheduled_at:
        type: string
      song_id:
        type: string
    required:
    - match_id
    - scheduled_at
    - song_id
    type: object
  clap_internal_modules_realtime_dto.TimeSyncRequest:
    properties:
      client_timestamp_ms:
        type: integer
    required:
    - client_timestamp_ms
    type: object
  clap_internal_modules_shop_dto.AddCartItemRequest:
    properties:
      product_id:
        type: string
      product_type:
        type: string
      quantity:
        minimum: 1
        type: integer
      size:
        type: string
    required:
    - product_id
    - product_type
    type: object
  clap_internal_modules_shop_dto.CreateProductRequest:
    properties:
      available_sizes:
        items:
          type: string
        type: array
      category:
        type: string
      description:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        minimum: 0
        type: integer
      price_points:
        minimum: 0
        type: integer
      product_type:
        type: string
      seller_name:
        type: string
      size_stock:
        items:
          $ref: '#/definitions/clap_internal_modules_shop_dto.SizeStockInput'
        type: array
      stock_quantity:
        type: integer
      subname:
        maxLength: 60
        type: string
    required:
    - category
    - name
    - price_cents
    - price_points
    - product_type
    type: object
  clap_internal_modules_shop_dto.DecreaseCartItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
      size:
        type: string
    required:
    - product_id
    type: object
  clap_internal_modules_shop_dto.SizeStockInput:
    properties:
      size:
        type: string
      stock_quantity:
        type: integer
    required:
    - size
    type: object
  clap_internal_modules_shop_dto.UpdateProductRequest:
    properties:
      available_sizes:
        items:
          type: string
        type: array
      category:
        type: string
      description:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price_cents:
        minimum: 0
        type: integer
      price_points:
        minimum: 0
        type: integer
      product_type:
        type: string
      seller_name:
        type: string
      size_stock:
        items:
          $ref: '#/definitions/clap_internal_modules_shop_dto.SizeStockInput'
        type: array
      stock_quantity:
        type: integer
      subname:
        maxLength: 60
        type: string
    required:
    - category
    - name
    - price_cents
    - price_points
    - product_type
    type: object
  clap_internal_modules_song_dto.CreateSongRequest:
    properties:
      album:
        type: string
      artist:
        type: string
      audio_url:
        type: string
      duration:
        type: integer
      is_active:
        type: boolean
      title:
        type: string
    required:
    - title
    type: object
  clap_internal_modules_song_dto.UpdateSongRequest:
    properties:
      album:
        type: string
      artist:
        type: string
      audio_url:
        type: string
      duration:
        type: integer
      is_active:
        type: boolean
      title:
        type: string
    required:
    - title
    type: object
  clap_internal_modules_songlyric_dto.CreateSongLyricRequest:
    properties:
      language:
        type: string
      lyrics:
        type: string
      song_id:
        type: string
    required:
    - language
    - lyrics
    - song_id
    type: object
  clap_internal_modules_songlyric_dto.ImportLyricsRequest:
    properties:
      content:
        type: string
      replace_existing:
        type: boolean
    required:
    - content
    type: object
  clap_internal_modules_songlyric_dto.UpdateSongLyricRequest:
    properties:
      language:
        type: string
      lyrics:
        type: string
    required:
    - language
    - lyrics
    type: object
  clap_internal_modules_user_dto.UpdateMobileProfileRequest:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  clap_internal_shared_response.ErrorDetail:
    properties:
      code:
        type: integer
      details:
        items:
          type: string
        type: array
      message:
        type: string
    type: object
  clap_internal_shared_response.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/clap_internal_shared_response.ErrorDetail'
      message:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
  internal_modules_auth_handler.ChangeEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_modules_auth_handler.LoginRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_modules_auth_handler.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_modules_auth_handler.RegisterRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - email
    - name
    type: object
  internal_modules_auth_handler.VerifyChangeEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  internal_modules_auth_handler.VerifyOTPRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  internal_modules_realtime_handler.TestEmitRequest:
    properties:
      broadcast:
        type: boolean
      match_id:
        type: string
      message:
        type: string
    type: object
info:
  contact:
    name: Clap API Support
  description: Clap match-day experience backend (auth, clubs, realtime).
  license:
    name: Proprietary
  termsOfService: http://swagger.io/terms/
  title: Clap Backend API
  version: "1.0"
paths:
  /api/v1/auth/change-email:
    post:
      consumes:
      - application/json
      description: Send a 4-digit OTP to the new email. Email is updated only after
        verify-change-email. Call again to resend.
      parameters:
      - description: New email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_handler.ChangeEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Change email (request OTP)
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Send a 4-digit OTP to a registered email. Call again to resend
        (cooldown applies).
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      summary: Login (OTP email)
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a refresh token for a new access/refresh pair
      parameters:
      - description: Refresh token payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_handler.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Start sign-up with name+email and send a 4-digit OTP. User is saved
        only after verify-otp. Call register again to resend.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      summary: Register (OTP email)
      tags:
      - auth
  /api/v1/auth/verify-change-email:
    post:
      consumes:
      - application/json
      description: Validate the OTP sent to the new email, update the account email,
        and issue fresh tokens
      parameters:
      - description: New email + OTP
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_handler.VerifyChangeEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Change email (verify OTP)
      tags:
      - auth
  /api/v1/auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Validate the 4-digit OTP and issue access/refresh tokens
      parameters:
      - description: OTP verification payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_handler.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      summary: Verify OTP
      tags:
      - auth
  /api/v1/chants:
    get:
      parameters:
      - description: Search query
        in: query
        name: search
        type: string
      - description: Match ID filter
        in: query
        name: match_id
        type: string
      - description: Chant ID of the last item from the previous page
        in: query
        name: cursor
        type: string
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: List chants
      tags:
      - chants
  /api/v1/chants/{chant_id}/complete:
    post:
      parameters:
      - description: Chant ID
        in: path
        name: chant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Complete chant
      tags:
      - chants
  /api/v1/chants/{chant_id}/lyrics:
    get:
      parameters:
      - description: Chant ID
        in: path
        name: chant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Chant lyrics
      tags:
      - chants
  /api/v1/media/{id}/playback-url:
    get:
      parameters:
      - description: Media ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Get playback URL
      tags:
      - media
  /api/v1/media/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Media file
        in: formData
        name: file
        required: true
        type: file
      - description: Media type
        in: formData
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Upload media
      tags:
      - media
  /api/v1/notifications/devices:
    delete:
      consumes:
      - application/json
      description: Removes the FCM token for the caller (used on logout). Idempotent
        if the token is already gone.
      parameters:
      - description: FCM token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_notification_dto.UnregisterDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Unregister FCM device token
      tags:
      - notifications
    post:
      consumes:
      - application/json
      description: Stores or updates the caller's FCM token so the backend can send
        push notifications to this device
      parameters:
      - description: FCM token and platform
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_notification_dto.RegisterDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Register FCM device token
      tags:
      - notifications
  /api/v1/orders:
    get:
      description: Returns the authenticated user's orders with cursor pagination
      parameters:
      - description: Order ID of the last item from the previous page
        in: query
        name: cursor
        type: string
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: List user orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Creates an order from the user's cart (Mobile API Contract §6.4)
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_order_dto.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Create checkout order
      tags:
      - orders
  /api/v1/orders/{order_id}:
    get:
      description: Returns one order with all line items, images, and quantities
      parameters:
      - description: Order ID
        in: path
        name: order_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Get order detail
      tags:
      - orders
  /api/v1/orders/{order_id}/confirm-payment:
    post:
      description: Verifies Stripe Checkout Session status and marks the order paid
      parameters:
      - description: Order ID
        in: path
        name: order_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Confirm browser card payment
      tags:
      - orders
  /api/v1/orders/{order_id}/pay:
    post:
      consumes:
      - application/json
      description: Completes payment with points or initiates Stripe card payment
      parameters:
      - description: Order ID
        in: path
        name: order_id
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_order_dto.PayOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Pay for an order
      tags:
      - orders
  /api/v1/orders/calculate:
    post:
      consumes:
      - application/json
      description: Preview subtotal, shipping, total, and points required for the
        current cart
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_order_dto.CalculateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Calculate checkout totals
      tags:
      - orders
  /api/v1/profile/leaderboard:
    get:
      parameters:
      - description: User ID of the last item from the previous page
        in: query
