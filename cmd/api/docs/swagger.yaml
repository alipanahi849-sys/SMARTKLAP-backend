basePath: /
definitions:
  clap_internal_modules_club_dto.CreateClubRequest:
    properties:
      country:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      logo_url:
        type: string
      name:
        type: string
      short_name:
        type: string
    required:
    - name
    type: object
  clap_internal_modules_club_dto.UpdateClubRequest:
    properties:
      country:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      logo_url:
        type: string
      name:
        type: string
      short_name:
        type: string
    required:
    - name
    type: object
  clap_internal_modules_clubseason_dto.CreateClubSeasonRequest:
    properties:
      club_id:
        type: string
      joined_at:
        type: string
      season_id:
        type: string
      status:
        enum:
        - active
        - suspended
        - withdrawn
        type: string
    required:
    - club_id
    - joined_at
    - season_id
    - status
    type: object
  clap_internal_modules_clubseason_dto.UpdateClubSeasonRequest:
    properties:
      status:
        enum:
        - active
        - suspended
        - withdrawn
        type: string
    required:
    - status
    type: object
  clap_internal_modules_guess_dto.AnswerQuizRequest:
    properties:
      choice:
        maxLength: 255
        type: string
    required:
    - choice
    type: object
  clap_internal_modules_league_dto.CreateLeagueRequest:
    properties:
      country:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      provider:
        type: string
      provider_league_id:
        type: string
    required:
    - name
    type: object
  clap_internal_modules_league_dto.UpdateLeagueRequest:
    properties:
      country:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      provider:
        type: string
      provider_league_id:
        type: string
    required:
    - name
    type: object
  clap_internal_modules_match_dto.CreateMatchRequest:
    properties:
      away_club_id:
        type: string
      home_club_id:
        type: string
      league_id:
        type: string
      match_datetime:
        type: string
      provider:
        type: string
      provider_match_id:
        type: string
      season_id:
        type: string
      stadium_name:
        type: string
      status:
        enum:
        - scheduled
        - live
        - halftime
        - finished
        - cancelled
        type: string
    required:
    - away_club_id
    - home_club_id
    - league_id
    - match_datetime
    - season_id
    - status
    type: object
  clap_internal_modules_match_dto.UpdateMatchRequest:
    properties:
      away_score:
        minimum: 0
        type: integer
      current_minute:
        maxLength: 10
        type: string
      home_score:
        minimum: 0
        type: integer
      match_datetime:
        type: string
      provider:
        type: string
      provider_match_id:
        type: string
      stadium_name:
        type: string
      status:
        enum:
        - scheduled
        - live
        - halftime
        - finished
        - cancelled
        type: string
    required:
    - match_datetime
    - status
    type: object
  clap_internal_modules_matchsongschedule_dto.CreateMatchSongScheduleRequest:
    properties:
      event_type:
        type: string
      is_active:
        type: boolean
      match_id:
        type: string
      scheduled_time:
        type: string
      song_id:
        type: string
    required:
    - event_type
    - match_id
    - scheduled_time
    - song_id
    type: object
  clap_internal_modules_matchsongschedule_dto.UpdateMatchSongScheduleRequest:
    properties:
      event_type:
        type: string
      is_active:
        type: boolean
      scheduled_time:
        type: string
    required:
    - event_type
    - scheduled_time
    type: object
  clap_internal_modules_playback_dto.ScheduleSongRequest:
    properties:
      duration_ms:
        description: |-
          DurationMs is the expected playback window in milliseconds.
          Providing it enables overlap detection against other schedules.
          Zero means "unknown duration" and overlap check is skipped.
        type: integer
      match_id:
        type: string
      scheduled_at:
        type: string
      song_id:
        type: string
    required:
    - match_id
    - scheduled_at
    - song_id
    type: object
  clap_internal_modules_realtime_dto.TimeSyncRequest:
    properties:
      client_timestamp_ms:
        type: integer
    required:
    - client_timestamp_ms
    type: object
  clap_internal_modules_season_dto.CreateSeasonRequest:
    properties:
      end_date:
        type: string
      is_active:
        type: boolean
      league_id:
        type: string
      name:
        type: string
      start_date:
        type: string
    required:
    - end_date
    - league_id
    - name
    - start_date
    type: object
  clap_internal_modules_season_dto.UpdateSeasonRequest:
    properties:
      end_date:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      start_date:
        type: string
    required:
    - end_date
    - name
    - start_date
    type: object
  clap_internal_modules_shop_dto.AddCartItemRequest:
    properties:
      product_id:
        type: string
      product_type:
        enum:
        - snack
        - merch
        type: string
      quantity:
        maximum: 99
        minimum: 1
        type: integer
      size:
        maxLength: 10
        type: string
    required:
    - product_id
    - product_type
    - quantity
    type: object
  clap_internal_modules_shop_dto.CheckoutRequest:
    properties:
      delivery_method:
        enum:
        - seat
        - pickup
        type: string
      seat_number:
        maxLength: 20
        type: string
    required:
    - delivery_method
    type: object
  clap_internal_modules_shop_dto.PayOrderRequest:
    properties:
      payment_method:
        maxLength: 30
        type: string
    required:
    - payment_method
    type: object
  clap_internal_modules_shop_dto.UpdateCartItemRequest:
    properties:
      quantity:
        maximum: 99
        minimum: 1
        type: integer
    required:
    - quantity
    type: object
  clap_internal_modules_song_dto.CreateSongRequest:
    properties:
      album:
        type: string
      artist:
        type: string
      audio_url:
        type: string
      duration:
        type: integer
      is_active:
        type: boolean
      title:
        type: string
    required:
    - title
    type: object
  clap_internal_modules_song_dto.UpdateSongRequest:
    properties:
      album:
        type: string
      artist:
        type: string
      audio_url:
        type: string
      duration:
        type: integer
      is_active:
        type: boolean
      title:
        type: string
    required:
    - title
    type: object
  clap_internal_modules_songlyric_dto.CreateSongLyricRequest:
    properties:
      language:
        type: string
      lyrics:
        type: string
      song_id:
        type: string
    required:
    - language
    - lyrics
    - song_id
    type: object
  clap_internal_modules_songlyric_dto.ImportLyricsRequest:
    properties:
      content:
        type: string
      replace_existing:
        type: boolean
    required:
    - content
    type: object
  clap_internal_modules_songlyric_dto.UpdateSongLyricRequest:
    properties:
      language:
        type: string
      lyrics:
        type: string
    required:
    - language
    - lyrics
    type: object
  clap_internal_modules_user_dto.UpdateMobileProfileRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  clap_internal_shared_response.ErrorDetail:
    properties:
      code:
        type: integer
      details:
        items:
          type: string
        type: array
      message:
        type: string
    type: object
  clap_internal_shared_response.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/clap_internal_shared_response.ErrorDetail'
      message:
        type: string
      success:
        type: boolean
    type: object
  internal_modules_auth_handler.LoginRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_modules_auth_handler.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_modules_auth_handler.RegisterRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - email
    - name
    type: object
  internal_modules_auth_handler.UpdateProfileRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
    type: object
  internal_modules_auth_handler.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp_code:
        type: string
    required:
    - email
    - otp_code
    type: object
  internal_modules_user_handler.CreateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      city:
        type: string
      country:
        type: string
      date_of_birth:
        type: string
    type: object
  internal_modules_user_handler.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      city:
        type: string
      country:
        type: string
      date_of_birth:
        type: string
    type: object
info:
  contact:
    name: Clap API Support
  description: Clap match-day experience backend (auth, clubs, matches, realtime,
    shop).
  license:
    name: Proprietary
  termsOfService: http://swagger.io/terms/
  title: Clap Backend API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Send a 4-digit OTP to a registered email. Call again to resend
        (cooldown applies).
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      summary: Login (OTP email)
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a refresh token for a new access/refresh pair
      parameters:
      - description: Refresh token payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_handler.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Start sign-up with name+email and send a 4-digit OTP. User is saved
        only after verify-otp. Call register again to resend.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      summary: Register (OTP email)
      tags:
      - auth
  /api/v1/auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Validate the 4-digit OTP and issue access/refresh tokens
      parameters:
      - description: OTP verification payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth_handler.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      summary: Verify OTP
      tags:
      - auth
  /api/v1/cart:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Get cart
      tags:
      - shop
  /api/v1/cart/items:
    post:
      consumes:
      - application/json
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_shop_dto.AddCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Add cart item
      tags:
      - shop
  /api/v1/cart/items/{item_id}:
    delete:
      parameters:
      - description: Cart item ID
        in: path
        name: item_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Remove cart item
      tags:
      - shop
    patch:
      consumes:
      - application/json
      parameters:
      - description: Cart item ID
        in: path
        name: item_id
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_shop_dto.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Update cart item
      tags:
      - shop
  /api/v1/chants:
    get:
      parameters:
      - description: Search query
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: List chants
      tags:
      - chants
  /api/v1/chants/{chant_id}/complete:
    post:
      parameters:
      - description: Chant ID
        in: path
        name: chant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Complete chant
      tags:
      - chants
  /api/v1/chants/{chant_id}/countdown:
    get:
      parameters:
      - description: Chant ID
        in: path
        name: chant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Chant countdown
      tags:
      - chants
  /api/v1/chants/{chant_id}/lyrics:
    get:
      parameters:
      - description: Chant ID
        in: path
        name: chant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Chant lyrics
      tags:
      - chants
  /api/v1/club-seasons:
    post:
      consumes:
      - application/json
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_clubseason_dto.CreateClubSeasonRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Add club to season
      tags:
      - club-seasons
  /api/v1/club-seasons/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ClubSeason ID
        in: path
        name: id
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_clubseason_dto.UpdateClubSeasonRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Update club-season status
      tags:
      - club-seasons
  /api/v1/clubs:
    get:
      parameters:
      - description: Sort field
        in: query
        name: sort
        type: string
      - description: asc|desc
        in: query
        name: order
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search query
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      summary: List clubs
      tags:
      - clubs
    post:
      consumes:
      - application/json
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_club_dto.CreateClubRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Create club
      tags:
      - clubs
  /api/v1/clubs/{id}:
    delete:
      parameters:
      - description: Club ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      security:
      - BearerAuth: []
      summary: Delete club
      tags:
      - clubs
    get:
      parameters:
      - description: Club ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
      summary: Get club
      tags:
      - clubs
    put:
      consumes:
      - application/json
      parameters:
      - description: Club ID
        in: path
        name: id
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clap_internal_modules_club_dto.UpdateClubRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/clap_internal_shared_response.Response'
